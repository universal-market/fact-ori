pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=pilot:1m rate=10r/s;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    location = /health {
      # Locations use normalized paths; proxy_pass preserves the original URI.
      # Require the public raw form too, before forwarding anything upstream.
      if ($request_uri != "/health") { return 404; }
      limit_except GET { deny all; }
      proxy_pass http://semantic:8081;
    }
    location = /v1/check {
      if ($request_uri != "/v1/check") { return 404; }
      limit_except POST OPTIONS { deny all; }
      limit_req zone=pilot burst=20 nodelay;
      proxy_read_timeout 30s;
      proxy_pass http://semantic:8081;
    }
    location ~ "^/v1/checks/[a-f0-9-]{36}$" {
      if ($request_uri !~ "^/v1/checks/[a-f0-9-]{36}$") { return 404; }
      limit_except GET OPTIONS { deny all; }
      limit_req zone=pilot burst=20 nodelay;
      proxy_pass http://semantic:8081;
    }
    location ~ "^/v1/jobs/[a-z0-9]{20,40}$" {
      if ($request_uri !~ "^/v1/jobs/[a-z0-9]{20,40}$") { return 404; }
      limit_except GET OPTIONS { deny all; }
      limit_req zone=pilot burst=20 nodelay;
      proxy_pass http://backend:3211;
    }
    location ~ ^/v1/records/C[0-9]+[a-z]?$ {
      if ($request_uri !~ "^/v1/records/C[0-9]+[a-z]?([?][A-Za-z0-9=&]*)?$") { return 404; }
      limit_except GET OPTIONS { deny all; }
      limit_req zone=pilot burst=20 nodelay;
      proxy_pass http://backend:3211;
    }
    location / { return 404; }
  }
}
